name: Flutter CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.7' # Используй версию, которая установлена у вас
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Run static analysis
      run: flutter analyze

    - name: Run tests
      run: flutter test