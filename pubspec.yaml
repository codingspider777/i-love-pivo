name: salamanca
description: "DayDock - приложение для студентов с календарем и картой кампуса."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  cupertino_icons: ^2.0.0
  go_router: ^18.1.2
  flutter_riverpod: ^3.4.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^5.1.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  table_calendar: ^3.3.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.2.5
  path_drawing: ^1.0.1 # <-- ДОБАВЛЕНО для парсинга SVG

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  drift_dev: ^2.35.3
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/main_map_light.svg
    - assets/images/main_map_dark.svg
    - assets/data/buildings.json

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/daydock_d2_combined.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/daydock_d2_background.png"
  adaptive_icon_foreground: "assets/icon/daydock_d2_foreground.png"